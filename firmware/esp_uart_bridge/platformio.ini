[platformio]
build_dir = D:/pio-build/esp_uart_bridge
src_dir = main

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = espidf
monitor_port = COM8
monitor_speed = 115200
upload_port = COM8
upload_speed = 460800

; Keep the ESP-IDF project configuration in sdkconfig.defaults and the
; operator's credentials in the ignored sdkconfig file.
board_build.flash_size = 4MB
