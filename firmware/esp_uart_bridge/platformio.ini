; Build:   pio run -e lolin_s2_mini      (or -e esp32s3)
; Flash:   pio run -e lolin_s2_mini -t upload --upload-port COM5
; Config:  pio run -e lolin_s2_mini -t menuconfig
;
; ESP-IDF reads sdkconfig.defaults plus sdkconfig.defaults.<target>. PlatformIO
; keeps the resulting configuration (with the Wi-Fi password) in
; sdkconfig.<env>, which is git-ignored.

[platformio]
build_dir = D:/pio-build/esp_uart_bridge
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB

[env:lolin_s2_mini]
board = lolin_s2_mini
monitor_port = COM8
upload_port = COM8

; ESP32-S3-DevKitC-1: dual core, more RAM. See sdkconfig.defaults.esp32s3 for pins.
[env:esp32s3]
board = esp32-s3-devkitc-1
